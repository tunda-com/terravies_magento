<!-- ko if: isDisplayed() -->
<!-- ko if: showTaxSeparately() -->
<!-- Base Fee Line -->
<tr class="totals fee" style="border-top: 1px solid #ccc;">
    <th class="mark" scope="row" style="padding-top: 12px;">
        <span class="label" data-bind="text: title"></span>
    </th>
    <td class="amount" style="padding-top: 12px;">
        <span class="price" data-bind="text: getBaseFeeValue()"></span>
    </td>
</tr>
<!-- Tax Line -->
<tr class="totals fee-tax">
    <th class="mark" scope="row">
        <span class="label" data-bind="text: getTaxTitle()" style="font-size: 0.95em;"></span>
    </th>
    <td class="amount">
        <span class="price" data-bind="text: getTaxValue()" style="font-size: 0.95em;"></span>
    </td>
</tr>
<!-- /ko -->

<!-- ko ifnot: showTaxSeparately() -->
<!-- Single Fee Line -->
<tr class="totals fee" style="border-top: 2px solid #ccc;">
    <th class="mark" scope="row" style="padding-top: 12px;">
        <span class="label" data-bind="text: title"></span>
    </th>
    <td class="amount" style="padding-top: 12px;">
        <span class="price" data-bind="text: getValue()"></span>
    </td>
</tr>
<!-- /ko -->
<!-- /ko -->
